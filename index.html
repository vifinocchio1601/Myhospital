<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyHospital</title>
<meta name="theme-color" content="#0e1922" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyHospital">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : la tablette du directeur, pensée d'abord pour le téléphone. Une colonne : barre d'état avec l'horloge réelle,
   quatre jauges, puis l'écran courant. Une barre d'onglets fixe en bas donne accès aux cinq écrans les plus utilisés. */
:root{
  color-scheme:dark;
  --bg:#0e1922; --surface:#162430; --surface-2:#1d2e3c; --line:#2a3d4d;
  --ink:#e8eff5; --muted:#93a6b6; --faint:#6d8091;
  --accent:#3f8fe0; --accent-2:#2a6ab3; --on-accent:#ffffff;
  --ok:#55c594; --ok-bg:#15372d; --warn:#e5b54a; --warn-bg:#3b3016; --bad:#f2786f; --bad-bg:#40201e; --info:#7fb3e6; --info-bg:#19304a; --nuit:#b7a2ee; --nuit-bg:#2c2649;
  --tri-rouge:#e5484d; --tri-orange:#f08c3a; --tri-jaune:#e6c13d; --tri-vert:#46b97a; --tri-bleu:#4c9be8;
  --c1:#3f8fe0; --c1b:#2a6ab3; --c2:#3fa796; --c2b:#2c7f73; --c3:#d9647a; --c3b:#a8425a; --c4:#8468cf; --c4b:#6144ad;
  --c5:#d6a243; --c5b:#a97627; --c6:#4f9d5d; --c6b:#35743f; --c7:#cf7f55; --c7b:#9c5632; --c8:#7d8794; --c8b:#535c68;
  --voile:rgba(5,11,16,.62);
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-doc:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:20px; --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#edf1f5; --surface:#ffffff; --surface-2:#f2f5f8; --line:#d8e0e8;
    --ink:#12222e; --muted:#536677; --faint:#8090a0;
    --accent:#2a72c4; --accent-2:#1f5a9e;
    --ok:#1b7a4a; --ok-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdefd2; --bad:#b3261e; --bad-bg:#fde5e2; --info:#1f5c99; --info-bg:#e4eef8; --nuit:#5a3fae; --nuit-bg:#ebe6fa;
    --tri-rouge:#d1343a; --tri-orange:#dd7420; --tri-jaune:#c79a12; --tri-vert:#2f9a5f; --tri-bleu:#2f7fd0;
    --voile:rgba(18,34,46,.38);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f2f5f8; --line:#d8e0e8;
  --ink:#12222e; --muted:#536677; --faint:#8090a0;
  --accent:#2a72c4; --accent-2:#1f5a9e;
  --ok:#1b7a4a; --ok-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdefd2; --bad:#b3261e; --bad-bg:#fde5e2; --info:#1f5c99; --info-bg:#e4eef8; --nuit:#5a3fae; --nuit-bg:#ebe6fa;
  --tri-rouge:#d1343a; --tri-orange:#dd7420; --tri-jaune:#c79a12; --tri-vert:#2f9a5f; --tri-bleu:#2f7fd0;
  --voile:rgba(18,34,46,.38);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ecran{max-width:920px;margin-inline:auto;padding-inline:16px;padding-block:14px 112px;display:flex;flex-direction:column;gap:20px}

/* Barre d'état */
.barre{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.marque{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);font-size:15px;min-width:0}
.marque span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,var(--c1),var(--c1b));color:var(--on-accent);font-weight:700;font-size:18px;flex:none}
.puce{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.puce svg{width:14px;height:14px}
.puce.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.puce.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.puce.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.puce.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.puce.num{font-variant-numeric:tabular-nums}

/* Titres */
.titre{display:flex;flex-direction:column;gap:4px}
.titre h1{font-size:clamp(26px,7vw,36px);line-height:1.12;font-weight:700;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.titre p{color:var(--muted)}
h2{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.retour{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 8px 6px 0;color:var(--muted);font-weight:500;align-self:flex-start}
.retour:hover{color:var(--ink)}
.aide{color:var(--muted);font-size:13.5px}

/* Jauges */
.jauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.jauge-nom{font-size:12.5px;color:var(--muted);font-weight:500}
.jauge-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.piste{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.plein{height:100%;border-radius:3px;background:var(--warn);transition:width .5s ease}
.n2 .plein{background:var(--ok)} .n0 .plein{background:var(--bad)} .nn .plein{background:var(--accent)}
.n0 .jauge-val{color:var(--bad)}
.jauge-bas{font-size:12px;color:var(--faint);min-height:18px}

/* Tuiles */
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tuile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.tuile:hover{border-color:var(--faint);transform:translateY(-1px)}
.tuile-icone{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--on-accent);flex:none}
.tuile-icone svg{width:24px;height:24px}
.g1{background:linear-gradient(160deg,var(--c1),var(--c1b))} .g2{background:linear-gradient(160deg,var(--c2),var(--c2b))}
.g3{background:linear-gradient(160deg,var(--c3),var(--c3b))} .g4{background:linear-gradient(160deg,var(--c4),var(--c4b))}
.g5{background:linear-gradient(160deg,var(--c5),var(--c5b))} .g6{background:linear-gradient(160deg,var(--c6),var(--c6b))}
.g7{background:linear-gradient(160deg,var(--c7),var(--c7b))} .g8{background:linear-gradient(160deg,var(--c8),var(--c8b))}
.tuile-texte{display:flex;flex-direction:column;gap:1px;min-width:0}
.tuile-nom{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tuile-chiffre{color:var(--muted);font-size:13.5px}

/* Boutons */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink);min-height:42px}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn svg{width:17px;height:17px}
.btn.principal{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.principal:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.large{padding:14px 20px;font-size:16px;width:100%}
.btn.petit{padding:6px 12px;font-size:13.5px;min-height:34px}

/* Alertes */
.alertes{display:flex;flex-direction:column;gap:8px}
.alerte{border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-weight:500;background:var(--info-bg);color:var(--info);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.alerte.warn{background:var(--warn-bg);color:var(--warn)} .alerte.bad{background:var(--bad-bg);color:var(--bad)} .alerte.ok{background:var(--ok-bg);color:var(--ok)}
.alerte .btn{background:transparent;border-color:currentColor;color:inherit}

/* Cartes et listes */
.bloc{display:flex;flex-direction:column;gap:10px;min-width:0}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.carte-haut{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.carte-haut h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.carte-haut small{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.entete{display:flex;gap:12px;align-items:center;min-width:0}
.entete .tuile-icone{width:40px;height:40px;border-radius:12px}
.entete .tuile-icone svg{width:20px;height:20px}
.liste{display:flex;flex-direction:column;gap:8px}
.rang{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.rang > div:first-child{min-width:0;flex:1 1 180px}
.rang b{font-weight:600}
.rang small{display:block;color:var(--muted);font-size:13px}
.rang .droite{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rang.moi{border-color:var(--info)}
svg.graphe text{stroke:none;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
svg.graphe{width:100%;height:auto}
.etoiles{color:var(--warn);letter-spacing:1px;white-space:nowrap}
.serie{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.jour-serie{text-align:center;padding:6px 0;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--faint);font-weight:700;font-size:13px}
.jour-serie.fait{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.salles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.salle{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;min-height:86px;min-width:0}
.salle b{font-size:14px;font-weight:700}
.salle small{color:var(--muted);font-size:12px}
.salle.ferme{border-style:dashed;opacity:.75}
.salle.verrou{opacity:.4}
.pts{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pt{width:10px;height:10px;border-radius:50%;background:var(--tri-vert);display:inline-block}
.pt.t-rouge{background:var(--tri-rouge)} .pt.t-orange{background:var(--tri-orange)} .pt.t-jaune{background:var(--tri-jaune)} .pt.t-bleu{background:var(--tri-bleu)}
.pt.soin{background:transparent;box-shadow:inset 0 0 0 2.5px var(--tri-vert);animation:battre 1.6s ease-in-out infinite}
.pt.soin.t-rouge{box-shadow:inset 0 0 0 2.5px var(--tri-rouge)} .pt.soin.t-orange{box-shadow:inset 0 0 0 2.5px var(--tri-orange)} .pt.soin.t-jaune{box-shadow:inset 0 0 0 2.5px var(--tri-jaune)} .pt.soin.t-bleu{box-shadow:inset 0 0 0 2.5px var(--tri-bleu)}
.pt.lit{border-radius:3px}
.plus-pts{font-size:11px;color:var(--muted)}
@keyframes battre{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.carte.crise{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.vide{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reglage > span{color:var(--muted);font-size:14px}
.pas{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.pas button{width:44px;height:42px;background:none;border:0;font-size:20px;font-weight:600;color:var(--ink)}
.pas button:hover:not(:disabled){background:var(--line)}
.pas output{min-width:86px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.progres{display:flex;flex-direction:column;gap:5px}
.progres-haut{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.progres-haut span{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

/* Triage (échelle de Manchester) */
.tri{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.tri i{width:9px;height:9px;border-radius:50%;background:var(--tri-vert)}
.t-rouge i{background:var(--tri-rouge)} .t-orange i{background:var(--tri-orange)} .t-jaune i{background:var(--tri-jaune)} .t-bleu i{background:var(--tri-bleu)}
.dossier{font-family:var(--f-doc);font-size:11.5px;color:var(--faint);letter-spacing:.02em}

/* Onglets et tableaux */
.onglets{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.onglet{flex:1;padding:10px 6px;background:none;border:0;border-right:1px solid var(--line);font-weight:600;color:var(--muted);font-size:14px}
.onglet:last-child{border-right:0}
.onglet.actif{background:var(--accent);color:var(--on-accent)}
.periode{display:flex;justify-content:space-between;align-items:center;gap:8px}
.periode b{font-size:16px;text-align:center;flex:1;min-width:0}
.periode .btn{padding:8px 12px}
.puces-choix{display:flex;gap:8px;flex-wrap:wrap}
.choix{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.choix.actif{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tableau{overflow-x:auto}
.tableau table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tableau th,.tableau td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tableau th:first-child,.tableau td:first-child{text-align:left;padding-left:0;white-space:normal}
.tableau th:last-child,.tableau td:last-child{padding-right:0}
.tableau thead th{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tableau tr.sous td{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:14px;border-bottom:0}
.tableau tr.total td{font-weight:700}
.tableau td.avant{color:var(--muted)}
.tableau tbody tr:last-child td{border-bottom:0}
.tableau.serre th,.tableau.serre td{padding:8px 4px;font-size:13px}
.tableau.serre thead th{font-size:10.5px;letter-spacing:.03em}
.plus-c{color:var(--ok)} .moins-c{color:var(--bad)}
.journal li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.journal li:last-child{border-bottom:0}
.journal time{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.journal .warn{color:var(--warn)} .journal .bad{color:var(--bad)} .journal .ok{color:var(--ok)}

/* Fondation */
.champ{display:flex;flex-direction:column;gap:6px;min-width:0}
.champ label,.champ > span{font-size:13px;color:var(--muted);font-weight:500}
.champ input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;width:100%;font-size:16px}

/* Barre d'onglets du bas */
.bas{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.bas > div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:min(560px,100%)}
.bas button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;position:relative;min-width:0}
.bas button.actif{color:var(--accent)}
.bas svg{width:22px;height:22px}
.pastille{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tri-orange);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Planning : une semaine type par personne, un bouton par jour */
.semaine{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.jour{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);min-width:0;color:var(--faint)}
.jour small{font-size:11px;font-weight:600;color:var(--muted)}
.jour b{font-size:12.5px;font-weight:700}
.jour.p-M{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.jour.p-A{background:var(--info-bg);border-color:transparent;color:var(--info)}
.jour.p-N{background:var(--nuit-bg);border-color:transparent;color:var(--nuit)}
.jour.ici{outline:2px solid var(--accent);outline-offset:1px}
.tableau table.grille th,.tableau table.grille td{text-align:center;padding:8px 2px}
.tableau table.grille th:first-child{text-align:left;white-space:nowrap;color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
.grille th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.grille td.zero{color:var(--faint)}
.grille td.ici{background:var(--info-bg);color:var(--info);font-weight:700}
.grille thead th.ici{color:var(--accent)}

/* Pharmacie et traitement */
.choix small{font-weight:500;opacity:.8}
.choix.rupture:not(.actif){border-color:var(--bad);color:var(--bad)}
.sous-titre{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.bascule{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.bascule button{padding:9px 16px;background:none;border:0;font-weight:600;color:var(--muted)}
.bascule button.actif{background:var(--accent);color:var(--on-accent)}

/* Dossier du patient */
.signes{display:flex;gap:6px;flex-wrap:wrap}
.signe{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.signe.ctx{background:var(--info-bg);color:var(--info);border-color:transparent}
.signe.oui{border-color:var(--accent)}
.signe.non{color:var(--faint);font-weight:500}
.test{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
button.test:hover:not(:disabled){border-color:var(--faint)}
.test b{font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.test b span{color:var(--muted);font-weight:500;font-size:13px;text-align:right}
.test small{font-size:13.5px;color:var(--muted)}
.test.fait{background:var(--surface)}
.test.anormal small{color:var(--warn);font-weight:600}
.cand{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);min-width:0}
.cand.actif{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cand > button{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:none;border:0;padding:12px}
.cand-nom{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cand .fiche{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.cand .fiche.seule{padding-top:12px}
.cand .fiche ul{display:flex;flex-direction:column;gap:4px}
.cand .fiche li{font-size:13.5px;color:var(--muted)}
.cand .fiche li b{color:var(--ink);font-weight:600}

@media (min-width:760px){
  .jauges{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .btn.large{width:auto}
  .deux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

// Le temps réel : on rejoue dans l'ordre tout ce qui devait arriver jusqu'à l'instant donné
function avancer(jusqua){
  var change=false, garde=0, t, quoi, qui, i, p, e, q, a, med;
  if(!S.fondeLe) return false;
  while(garde++<400000){
    t=S.prochaineCloture; quoi="cloture"; qui=null; med=meilleurMedecin()>0;
    if(S.arrivees.length&&S.arrivees[0].t<t){ t=S.arrivees[0].t; quoi="arrivee"; }
    if(S.evts.length&&S.evts[0].t<t){ t=S.evts[0].t; quoi="evenement"; }
    if(S.commandes.length&&S.commandes[0].t<t){ t=S.commandes[0].t; quoi="livraison"; }
    if(S.releve&&S.releve<t){ t=S.releve; quoi="releve"; }
    if(S.crise&&S.crise.limite<t){ t=S.crise.limite; quoi="crise"; }
    if(S.greffe&&S.greffe.offre&&S.greffe.offre.limite<t){ t=S.greffe.offre.limite; quoi="offre"; }
    if(S.ministre&&S.ministre.t<t){ t=S.ministre.t; quoi="ministre"; }
    if(S.fondation&&S.fondation.gala&&S.fondation.gala.t<t){ t=S.fondation.gala.t; quoi="gala"; }
    if(S.ville&&!S.ville.lance&&S.ville.t<t){ t=S.ville.t; quoi="ville"; }
    for(i=0;i<S.patients.length;i++){
      p=S.patients[i];
      if(p.etat==="diag"){ if(p.auto&&p.auto<=p.limite&&qualiteRelais(p)>0){ e=p.auto; q="relais"; } else { e=p.limite; q="depart"; } a=testsEnCours(p,S.horloge); if(a&&a<e){ e=a; q="resultat"; } }
      else if(p.etat==="attente"){ e=p.limite; q="depart"; }
      else if(p.etat==="soin"){ e=p.fin; q="soin"; }
      else { e=p.sortie; q="lit"; }
      if((p.etat==="diag"||p.etat==="attente")&&p.pire&&p.pire<e){ e=p.pire; q="aggrave"; }
      if(e<t){ t=e; quoi=q; qui=p; }
    }
    if(t>jusqua) break;
    if(t<S.horloge) t=S.horloge;
    change=true; S.horloge=t;
    if(quoi==="cloture"){ cloturer(t); S.prochaineCloture=prochainMinuit(t+1000); }
    else if(quoi==="arrivee"){
      a=S.arrivees.shift(); p=creerPatient(t,a.mal||null); if(a.ev===2) p.blanc=1; if(a.rdv) p.rdv=1;
      if(a.dos&&S.dossiers[a.dos]){ qui=S.dossiers[a.dos]; p.prenom=qui.prenom; p.nom=qui.nom; p.femme=qui.femme; p.age=qui.age; p.dossier=a.dos; p.retour=1; qui=null; }
      accueillir(p,t);
    }
    else if(quoi==="evenement"){ a=S.evts.shift(); if(a.crise) lancerCrise(t); else if(a.greffe) offrirGreffon(t); else declencher(t); }
    else if(quoi==="crise") resoudreCrise(t,null);
    else if(quoi==="offre") deciderGreffon(t,null);
    else if(quoi==="ministre") visiteMinistre(t);
    else if(quoi==="gala") soireeGala(t);
    else if(quoi==="ville") lancerVille(t);
    else if(quoi==="livraison"){ a=S.commandes.shift(); S.stock[a.p]=stockDe(a.p)+a.n; S.valStock[a.p]=(S.valStock[a.p]||0)+(a.v===undefined?PRODUITS[a.p].cout*a.n:a.v); }
    else if(quoi==="releve"){ S.releve=prochaineReleve(t+1000); affecter(t); }
    else if(quoi==="aggrave"){ aggraver(qui,t); affecter(t); }
    else if(quoi==="resultat"){ /* un résultat de test est arrivé : l'écran se met à jour */ }
    else if(quoi==="relais") diagnostiquerSeul(qui,t);
    else if(quoi==="depart") partir(qui,t);
    else if(quoi==="soin") finSoin(qui,t);
    else { sortir(qui,t); affecter(t); }
  }
  if(jusqua>S.horloge) S.horloge=jusqua;
  return change;
}

function activite(ms){

  }
  return paye;
}

/* ------------------------------------------------------------------ Morceaux d'écran */
function barre(){
  return '<header class="barre"><div class="marque"><span class="logo">'+h((S.perso&&S.perso.logo)||"H")+'</span><span>'+h(S.fondeLe?S.nom:"MyHospital")+'</span></div>'
    +'<span class="puce num">'+I.horloge+'<span id="horloge">'+horlogeTxt(maintenant())+'</span></span></header>';
}
function entete(titre,sous,cible,nomCible){
  return '<button type="button" class="retour" data-a="aller" data-e="'+(cible||"accueil")+'">'+I.retour+(nomCible||"Accueil")+'</button>'
    +'<div class="titre"><h1>'+h(titre)+'</h1>'+(sous?'<p>'+sous+'</p>':'')+'</div>';
}
function jauge(nom,val,niv,pct,bas){
  return '<div class="jauge '+(niv||"")+'"><span class="jauge-nom">'+nom+'</span><span class="jauge-val">'+val+'</span>'
    +(pct===null?'':'<div class="piste"><div class="plein" style="width:'+borne(pct,0,100)+'%"></div></div>')
    +'<span class="jauge-bas">'+(bas||"")+'</span></div>';
}
function tuile(g,ic,nom,chiffre,cible){
  return '<button type="button" class="tuile" data-a="aller" data-e="'+cible+'"><span class="tuile-icone '+g+'">'+I[ic]+'</span>'
    +'<span class="tuile-texte"><span class="tuile-nom">'+nom+'</span><span class="tuile-chiffre">'+chiffre+'</span></span></button>';
}
function triHtml(tri){ return '<span class="tri t-'+tri+'" title="Triage : '+TRI[tri][1]+'"><i></i>'+TRI[tri][0]+'</span>'; }
function pas(action,cle,valeur,delta,moinsOk,plusOk,libelle){
  return '<div class="pas"><button type="button" data-a="'+action+'" data-k="'+cle+'" data-d="'+(-delta)+'" aria-label="Baisser '+libelle+'"'+(moinsOk?'':' disabled')+'>−</button>'
    +'<output>'+valeur+'</output>'
    +'<button type="button" data-a="'+action+'" data-k="'+cle+'" data-d="'+delta+'" aria-label="Augmenter '+libelle+'"'+(plusOk?'':' disabled')+'>+</button></div>';
}
function libReputation(r){ return r>=80?"Excellente":r>=65?"Bonne":r>=50?"Correcte":r>=35?"Fragile":"Mauvaise"; }
function alertes(){
  var l=[], rep, k, m, n;
  function a(classe,texte,cible,bouton){ l.push('<div class="alerte '+classe+'"><span>'+texte+'</span>'+(cible?'<button type="button" class="btn petit" data-a="aller" data-e="'+cible+'">'+bouton+'</button>':'')+'</div>'); }
  if(!S.portes){ a("","Engagez un médecin généraliste ou un infirmier : le cabinet ouvrira ses portes aussitôt.","recrutement","Recruter"); return l.join(""); }
  if(!enPosteMaintenant()) a("warn","Aucun soignant n'est en poste en ce moment ("+POSTES[posteDe(S.horloge).k].nom.toLowerCase()+"). Un médecin de garde assure le minimum : moins de patients, soignés plus lentement.","planning","Voir le planning");
  n=S.contestes.filter(function(c){ return !c.relance; }).length;
  if(n) a("warn","La mutuelle conteste "+pl(n,"lot","lots")+" de factures. Sans relance, l'argent est perdu.","mutuelles","Voir les mutuelles");
  if(S.plaintes.length) a("bad",pl(S.plaintes.length,"plainte attend","plaintes attendent")+" votre décision.","journal","Voir les plaintes");
  if(S.demandes.length) a("",pl(S.demandes.length,"demande de congé attend","demandes de congé attendent")+" votre réponse.","planning","Voir le planning");
  n=S.equipe.filter(function(e){ return absentLe(e,S.horloge)&&!e.absent.interim; }).map(function(e){ return nomComplet(e)+" ("+(e.absent.motif==="maladie"?"malade":"en congé")+")"; });
  if(n.length) a("warn",(n.length>1?"Absents aujourd'hui : ":"Absence aujourd'hui : ")+n.join(", ")+".","planning","Voir le planning");
  n=aDiagnostiquer().length;
  if(n) a("",pl(n,"patient attend","patients attendent")+" votre diagnostic.","patients","Voir les patients");
  if(S.stat.sansDiag) a("warn",pl(S.stat.sansDiag,"patient est reparti","patients sont repartis")+" sans diagnostic aujourd'hui."+(meilleurMedecin()?"":" Sans médecin en poste, vous seul pouvez les diagnostiquer."),"patients","Voir les patients");
  if(S.caisse<0) a("bad","La caisse est à découvert : la banque prélève 0,2 % par jour. L'hôpital ne peut pas faire faillite, mais les achats sont bloqués, sauf la pharmacie jusqu'à "+mt(DECOUVERT_MAX)+" de découvert.");
  debloques().forEach(function(sv){
    if(!S.ouverts[sv]) a("","Le service "+SERVICES[sv].nom+" peut ouvrir ("+mt(SERVICES[sv].cout)+")."+(S.stat.manque[sv]?" Aujourd'hui, "+pl(S.stat.manque[sv],"patient a été envoyé","patients ont été envoyés")+" ailleurs.":""),"services","Voir les services");
    else if(!soignantsDe(sv)) a("warn",sv==="imagerie"?"Imagerie : aucun radiologue, donc ni radio, ni échographie, ni scanner.":SERVICES[sv].nom+" : personne pour soigner. Les patients attendent, puis repartent.","recrutement","Recruter");
    else if(S.stat.sansSoin[sv]) a("warn",SERVICES[sv].nom+" : "+pl(S.stat.sansSoin[sv],"patient est reparti","patients sont repartis")+" sans soins aujourd'hui. L'équipe ne suit pas.","equipe","Voir l'équipe");
  });
  n=Object.keys(S.stat.ruptures).map(function(k){ return nomProduit(k)+" ("+S.stat.ruptures[k]+")"; });
  if(n.length) a("bad","Rupture de stock aujourd'hui : "+n.join(", ")+". Ces patients ont été soignés sans leur traitement.","pharmacie","Voir la pharmacie");
  n=produitsConnus().filter(function(k){ return stockDe(k)<=SEUIL_STOCK&&!enCommande(k); }).map(nomProduit);
  if(n.length) a("warn","Stock bas : "+n.join(", ")+".","pharmacie","Commander");
  if(couvAccueil()<1) a("warn",nb("secretaire")?"L'accueil est débordé : il manque un secrétaire médical.":"Personne à l'accueil : engagez un secrétaire médical.","recrutement","Recruter");
  if(couvProprete()<1) a("warn",nb("agent")?"Les locaux ne sont pas assez propres : il manque un agent d'entretien.":"Personne ne nettoie les locaux : engagez un agent d'entretien.","recrutement","Recruter");
  if(couvLits()<1) a("warn","Trop de patients alités pour le nombre d'infirmiers (un infirmier pour "+LITS_PAR_INFIRMIER+" lits occupés).","recrutement","Recruter");
  if(S.lits&&litsLibres()<=0) a("warn","Tous les lits sont occupés : les prochains opérés seront envoyés ailleurs après les soins.","services","Acheter un lit");
  if(S.stat.sansLit) a("warn",pl(S.stat.sansLit,"patient a dû être envoyé","patients ont dû être envoyés")+" ailleurs après les soins, faute de lit.","services","Acheter un lit");
  ORDRE_ROLES.forEach(function(r){ m=moral(r); n=nb(r); if(n&&m<40) a("bad","Le moral des "+ROLES[r].pluriel.toLowerCase()+" est bas ("+m+" / 100) : risque de démission.","equipe","Voir l'équipe"); });
  return l.join("");
}
function palierHtml(){
  var p=prochainPalier(), rep=Math.round(reputation());
  if(!p) return '<div class="carte"><div class="carte-haut"><h3>'+PALIERS[S.palier].nom+'<small>Dernier palier atteint. Tous les services sont débloqués.</small></h3></div></div>';
  return '<div class="carte"><div class="carte-haut"><h3>Prochain palier : '+p.nom+'<small>Débloque '+ORDRE_SERVICES.filter(function(k){return SERVICES[k].palier===S.palier+1;}).map(function(k){return SERVICES[k].nom;}).join(", ")+(S.palier===0?" et les lits":"")+(S.palier+1===RECHERCHE_PALIER?" et le centre de recherche":"")+'.</small></h3></div>'
    +'<div class="progres '+(S.soignes>=p.min?"n2":"nn")+'"><div class="progres-haut"><b>Patients soignés</b><span>'+Math.min(S.soignes,p.min)+" / "+p.min+'</span></div><div class="piste"><div class="plein" style="width:'+borne(S.soignes/p.min*100,0,100)+'%"></div></div></div>'
    +'<div class="progres '+(rep>=p.rep?"n2":"nn")+'"><div class="progres-haut"><b>Réputation</b><span>'+rep+" / "+p.rep+' au moins</span></div><div class="piste"><div class="plein" style="width:'+borne(rep/p.rep*100,0,100)+'%"></div></div></div></div>';
}

function ecranAccueil(){
  var rep=Math.round(reputation()), att=enAttente().length, nd=aDiagnostiquer().length, occ=alites().length, jr=resultatJour(), al=alertes(), pro=S.arrivees.length?S.arrivees[0].t:null;
  var r=U.resume, bloc="";
  if(r) bloc='<div class="carte"><div class="carte-haut"><h3>Pendant votre absence<small>'+dureeTxt(r.duree)+'</small></h3><button type="button" class="btn petit" data-a="resume">Fermer</button></div>'
    +'<p>'+pl(r.soignes,"patient soigné","patients soignés")+'. Caisse : <b class="'+(r.caisse>=0?"plus-c":"moins-c")+'">'+signeM(r.caisse)+'</b>. Réputation : '+(r.rep>0?"+":r.rep<0?"−":"")+Math.abs(r.rep)+' '+(Math.abs(r.rep)>1?"points":"point")+'.</p></div>';

    +jauge("Caisse",mt(S.caisse),S.caisse<0?"n0":"",null,"Aujourd'hui "+signeM(jr))

    +jauge("Patients du jour",pl(S.stat.soignes,"soigné","soignés"),"",null,nd+" à diagnostiquer · "+pl(S.stat.partis,"reparti","repartis"))
    +(S.palier>=1?jauge("Lits",occ+" / "+placesLits(),placesLits()&&occ>=placesLits()?"n0":"nn",placesLits()?occ/placesLits()*100:0,placesLits()?pl(placesLits()-occ,"libre","libres"):"Aucun lit acheté")
      :jauge("Équipe",pl(S.equipe.length,"personne","personnes"),"",null,pl(enPosteMaintenant(),"soignant en poste","soignants en poste")))
    +'</div>'

    +tuile("g2","pilule","Pharmacie",pl(produitsConnus().filter(function(k){ return stockDe(k)<=SEUIL_STOCK; }).length,"stock bas","stocks bas"),"pharmacie")

function calendrierHtml(){

  if(P) l.push('<div class="alerte"><span><b>'+P[2]+'</b> : '+P[3]+'.</span></div>');

  return l.length?'<div class="alertes">'+l.join("")+'</div>':"";
}

/* ------------------------------------------------------------------ Sauvegarde sur le compte (téléphone et ordinateur) */
var APPAREIL=(function(){ var id=null; try{ id=localStorage.getItem(CLE_APP); if(!id){ id="a"+Math.random().toString(36).slice(2,12); localStorage.setItem(CLE_APP,id); } }catch(e){} return id||"a"+Math.random().toString(36).slice(2,12); })();
var nuage={ref:null,connu:null,occupe:false,sale:false,dernier:0}, gel=false;
function marquer(){ S.modif=Date.now(); nuage.sale=true; }
function pousser(force){
  var t, corps;
  if(!nuage.ref||nuage.occupe||!nuage.sale||!S.fondeLe) return;
  if(!force&&Date.now()-nuage.dernier<15000) return;
  t=S.modif||Date.now(); corps={v:V,t:t,appareil:APPAREIL,json:JSON.stringify(S)};
  if(corps.json.length>200000){ S.registre.length=Math.min(S.registre.length,20); S.journal.length=Math.min(S.journal.length,40); corps.json=JSON.stringify(S); }
  nuage.occupe=true; nuage.sale=false; nuage.dernier=Date.now();
  nuage.ref.set(corps).then(function(){ nuage.connu=t; nuage.occupe=false; },function(e){
    nuage.occupe=false;
    if(e&&(e.code==="unavailable"||e.code==="resource_exhausted")) nuage.sale=true; else nuage.ref=null;
  });
}
function adopter(d){
  var o; try{ o=JSON.parse(d.json); }catch(e){ return false; }
  if(!valide(o)||!o.fondeLe) return false;
  S=o; migrer(); nuage.connu=d.t; nuage.sale=false; avancer(maintenant()); sauver(); return true;
}
function distant(d){ return !!(d&&d.json&&d.appareil!==APPAREIL&&d.t!==nuage.connu&&d.t>(nuage.connu||0)); }
function brancher(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(id){
      var ref;
      if(!id) return null;
      try{ ref=db.doc("data/users/"+id+"/partie"); }catch(e){ return null; }
      return ref.get().then(function(snap){
        var d=snap.exists?snap.data():null;
        nuage.ref=ref;
        if(d&&d.json&&(!S.fondeLe||d.t>(S.modif||0))){ if(adopter(d)) rendre(); }
        else { if(d) nuage.connu=d.t; if(S.fondeLe) nuage.sale=true; }
        ref.onSnapshot(function(s){
          var x=s.exists?s.data():null;
          if(s.metadata&&s.metadata.hasPendingWrites) return;
          if(distant(x)&&adopter(x)) rendre();
        },function(){});
        pousser(true);
        if(U.ecran==="reglages") rendre();
      });
    });
  }).catch(function(){});
}
// Au retour sur le jeu, on regarde d'abord si la partie a avancé sur un autre appareil
function revenir(){
  var fini=false;
  function suite(){ if(fini) return; fini=true; gel=false; battement(true); }
  if(!nuage.ref||!S.fondeLe){ battement(true); return; }
  gel=true; setTimeout(suite,4000);
  nuage.ref.get().then(function(snap){ var d=snap.exists?snap.data():null; if(distant(d)) adopter(d); suite(); },suite);
}

function resumer(avant){

var meteoOcc=false, meteoChoix=null, meteoMsg="";
function majMeteo(force){
  var M=S.meteo, avant;

function battement(retour){
  var n=Date.now(), ecoule=Math.min(n-dernierBattement,2000), paye, avant, change;
