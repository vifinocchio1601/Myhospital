<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyHospital</title>
<meta name="theme-color" content="#0e1922" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyHospital">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : la tablette du directeur, pensée d'abord pour le téléphone. Une colonne : barre d'état avec l'horloge réelle,
   quatre jauges, puis l'écran courant. Une barre d'onglets fixe en bas donne accès aux cinq écrans les plus utilisés. */
:root{
  color-scheme:dark;
  --bg:#0e1922; --surface:#162430; --surface-2:#1d2e3c; --line:#2a3d4d;
  --ink:#e8eff5; --muted:#93a6b6; --faint:#6d8091;
  --accent:#3f8fe0; --accent-2:#2a6ab3; --on-accent:#ffffff;
  --ok:#55c594; --ok-bg:#15372d; --warn:#e5b54a; --warn-bg:#3b3016; --bad:#f2786f; --bad-bg:#40201e; --info:#7fb3e6; --info-bg:#19304a; --nuit:#b7a2ee; --nuit-bg:#2c2649;
  --tri-rouge:#e5484d; --tri-orange:#f08c3a; --tri-jaune:#e6c13d; --tri-vert:#46b97a; --tri-bleu:#4c9be8;
  --c1:#3f8fe0; --c1b:#2a6ab3; --c2:#3fa796; --c2b:#2c7f73; --c3:#d9647a; --c3b:#a8425a; --c4:#8468cf; --c4b:#6144ad;
  --c5:#d6a243; --c5b:#a97627; --c6:#4f9d5d; --c6b:#35743f; --c7:#cf7f55; --c7b:#9c5632; --c8:#7d8794; --c8b:#535c68;
  --voile:rgba(5,11,16,.62);
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-doc:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:20px; --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#edf1f5; --surface:#ffffff; --surface-2:#f2f5f8; --line:#d8e0e8;
    --ink:#12222e; --muted:#536677; --faint:#8090a0;
    --accent:#2a72c4; --accent-2:#1f5a9e;
    --ok:#1b7a4a; --ok-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdefd2; --bad:#b3261e; --bad-bg:#fde5e2; --info:#1f5c99; --info-bg:#e4eef8; --nuit:#5a3fae; --nuit-bg:#ebe6fa;
    --tri-rouge:#d1343a; --tri-orange:#dd7420; --tri-jaune:#c79a12; --tri-vert:#2f9a5f; --tri-bleu:#2f7fd0;
    --voile:rgba(18,34,46,.38);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f2f5f8; --line:#d8e0e8;
  --ink:#12222e; --muted:#536677; --faint:#8090a0;
  --accent:#2a72c4; --accent-2:#1f5a9e;
  --ok:#1b7a4a; --ok-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdefd2; --bad:#b3261e; --bad-bg:#fde5e2; --info:#1f5c99; --info-bg:#e4eef8; --nuit:#5a3fae; --nuit-bg:#ebe6fa;
  --tri-rouge:#d1343a; --tri-orange:#dd7420; --tri-jaune:#c79a12; --tri-vert:#2f9a5f; --tri-bleu:#2f7fd0;
  --voile:rgba(18,34,46,.38);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ecran{max-width:920px;margin-inline:auto;padding-inline:16px;padding-block:14px 112px;display:flex;flex-direction:column;gap:20px}

/* Barre d'état */
.barre{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.marque{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);font-size:15px;min-width:0}
.marque span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,var(--c1),var(--c1b));color:var(--on-accent);font-weight:700;font-size:18px;flex:none}
.puce{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.puce svg{width:14px;height:14px}
.puce.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.puce.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.puce.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.puce.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.puce.num{font-variant-numeric:tabular-nums}

/* Titres */
.titre{display:flex;flex-direction:column;gap:4px}
.titre h1{font-size:clamp(26px,7vw,36px);line-height:1.12;font-weight:700;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.titre p{color:var(--muted)}
h2{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.retour{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 8px 6px 0;color:var(--muted);font-weight:500;align-self:flex-start}
.retour:hover{color:var(--ink)}
.aide{color:var(--muted);font-size:13.5px}

/* Jauges */
.jauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.jauge-nom{font-size:12.5px;color:var(--muted);font-weight:500}
.jauge-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.piste{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.plein{height:100%;border-radius:3px;background:var(--warn);transition:width .5s ease}
.n2 .plein{background:var(--ok)} .n0 .plein{background:var(--bad)} .nn .plein{background:var(--accent)}
.n0 .jauge-val{color:var(--bad)}
.jauge-bas{font-size:12px;color:var(--faint);min-height:18px}

/* Tuiles */
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tuile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.tuile:hover{border-color:var(--faint);transform:translateY(-1px)}
.tuile-icone{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--on-accent);flex:none}
.tuile-icone svg{width:24px;height:24px}
.g1{background:linear-gradient(160deg,var(--c1),var(--c1b))} .g2{background:linear-gradient(160deg,var(--c2),var(--c2b))}
.g3{background:linear-gradient(160deg,var(--c3),var(--c3b))} .g4{background:linear-gradient(160deg,var(--c4),var(--c4b))}
.g5{background:linear-gradient(160deg,var(--c5),var(--c5b))} .g6{background:linear-gradient(160deg,var(--c6),var(--c6b))}
.g7{background:linear-gradient(160deg,var(--c7),var(--c7b))} .g8{background:linear-gradient(160deg,var(--c8),var(--c8b))}
.tuile-texte{display:flex;flex-direction:column;gap:1px;min-width:0}
.tuile-nom{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tuile-chiffre{color:var(--muted);font-size:13.5px}

/* Boutons */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink);min-height:42px}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn svg{width:17px;height:17px}
.btn.principal{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.principal:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.large{padding:14px 20px;font-size:16px;width:100%}
.btn.petit{padding:6px 12px;font-size:13.5px;min-height:34px}

/* Alertes */
.alertes{display:flex;flex-direction:column;gap:8px}
.alerte{border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-weight:500;background:var(--info-bg);color:var(--info);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.alerte.warn{background:var(--warn-bg);color:var(--warn)} .alerte.bad{background:var(--bad-bg);color:var(--bad)} .alerte.ok{background:var(--ok-bg);color:var(--ok)}
.alerte .btn{background:transparent;border-color:currentColor;color:inherit}

/* Cartes et listes */
.bloc{display:flex;flex-direction:column;gap:10px;min-width:0}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.carte-haut{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.carte-haut h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.carte-haut small{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.entete{display:flex;gap:12px;align-items:center;min-width:0}
.entete .tuile-icone{width:40px;height:40px;border-radius:12px}
.entete .tuile-icone svg{width:20px;height:20px}
.liste{display:flex;flex-direction:column;gap:8px}
.rang{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.rang > div:first-child{min-width:0;flex:1 1 180px}
.rang b{font-weight:600}
.rang small{display:block;color:var(--muted);font-size:13px}
.rang .droite{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rang.moi{border-color:var(--info)}
.vide{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reglage > span{color:var(--muted);font-size:14px}
.pas{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.pas button{width:44px;height:42px;background:none;border:0;font-size:20px;font-weight:600;color:var(--ink)}
.pas button:hover:not(:disabled){background:var(--line)}
.pas output{min-width:86px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.progres{display:flex;flex-direction:column;gap:5px}
.progres-haut{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.progres-haut span{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

/* Triage (échelle de Manchester) */
.tri{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.tri i{width:9px;height:9px;border-radius:50%;background:var(--tri-vert)}
.t-rouge i{background:var(--tri-rouge)} .t-orange i{background:var(--tri-orange)} .t-jaune i{background:var(--tri-jaune)} .t-bleu i{background:var(--tri-bleu)}
.dossier{font-family:var(--f-doc);font-size:11.5px;color:var(--faint);letter-spacing:.02em}

/* Onglets et tableaux */
.onglets{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.onglet{flex:1;padding:10px 6px;background:none;border:0;border-right:1px solid var(--line);font-weight:600;color:var(--muted);font-size:14px}
.onglet:last-child{border-right:0}
.onglet.actif{background:var(--accent);color:var(--on-accent)}
.periode{display:flex;justify-content:space-between;align-items:center;gap:8px}
.periode b{font-size:16px;text-align:center;flex:1;min-width:0}
.periode .btn{padding:8px 12px}
.puces-choix{display:flex;gap:8px;flex-wrap:wrap}
.choix{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.choix.actif{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tableau{overflow-x:auto}
.tableau table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tableau th,.tableau td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tableau th:first-child,.tableau td:first-child{text-align:left;padding-left:0;white-space:normal}
.tableau th:last-child,.tableau td:last-child{padding-right:0}
.tableau thead th{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tableau tr.sous td{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:14px;border-bottom:0}
.tableau tr.total td{font-weight:700}
.tableau td.avant{color:var(--muted)}
.tableau tbody tr:last-child td{border-bottom:0}
.plus-c{color:var(--ok)} .moins-c{color:var(--bad)}
.journal li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.journal li:last-child{border-bottom:0}
.journal time{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.journal .warn{color:var(--warn)} .journal .bad{color:var(--bad)} .journal .ok{color:var(--ok)}

/* Fondation */
.champ{display:flex;flex-direction:column;gap:6px;min-width:0}
.champ label,.champ > span{font-size:13px;color:var(--muted);font-weight:500}
.champ input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;width:100%;font-size:16px}

/* Barre d'onglets du bas */
.bas{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.bas > div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:min(560px,100%)}
.bas button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;position:relative;min-width:0}
.bas button.actif{color:var(--accent)}
.bas svg{width:22px;height:22px}
.pastille{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tri-orange);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Planning : une semaine type par personne, un bouton par jour */
.semaine{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.jour{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);min-width:0;color:var(--faint)}
.jour small{font-size:11px;font-weight:600;color:var(--muted)}
.jour b{font-size:12.5px;font-weight:700}
.jour.p-M{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.jour.p-A{background:var(--info-bg);border-color:transparent;color:var(--info)}
.jour.p-N{background:var(--nuit-bg);border-color:transparent;color:var(--nuit)}
.jour.ici{outline:2px solid var(--accent);outline-offset:1px}
.tableau table.grille th,.tableau table.grille td{text-align:center;padding:8px 2px}
.tableau table.grille th:first-child{text-align:left;white-space:nowrap;color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
.grille th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.grille td.zero{color:var(--faint)}
.grille td.ici{background:var(--info-bg);color:var(--info);font-weight:700}
.grille thead th.ici{color:var(--accent)}

/* Pharmacie et traitement */
.choix small{font-weight:500;opacity:.8}
.choix.rupture:not(.actif){border-color:var(--bad);color:var(--bad)}
.sous-titre{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.bascule{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.bascule button{padding:9px 16px;background:none;border:0;font-weight:600;color:var(--muted)}
.bascule button.actif{background:var(--accent);color:var(--on-accent)}

/* Dossier du patient */
.signes{display:flex;gap:6px;flex-wrap:wrap}
.signe{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.signe.ctx{background:var(--info-bg);color:var(--info);border-color:transparent}
.signe.oui{border-color:var(--accent)}
.signe.non{color:var(--faint);font-weight:500}
.test{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
button.test:hover:not(:disabled){border-color:var(--faint)}
.test b{font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.test b span{color:var(--muted);font-weight:500;font-size:13px;text-align:right}
.test small{font-size:13.5px;color:var(--muted)}
.test.fait{background:var(--surface)}
.test.anormal small{color:var(--warn);font-weight:600}
.cand{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);min-width:0}
.cand.actif{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cand > button{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:none;border:0;padding:12px}
.cand-nom{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cand .fiche{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.cand .fiche.seule{padding-top:12px}
.cand .fiche ul{display:flex;flex-direction:column;gap:4px}
.cand .fiche li{font-size:13.5px;color:var(--muted)}
.cand .fiche li b{color:var(--ink);font-weight:600}

@media (min-width:760px){
  .jauges{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .btn.large{width:auto}
  .deux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
<style>html{background:var(--bg);overscroll-behavior-y:none}</style>

<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ Règles de l'hôpital */
var V=1, CLE="myhospital-v1", CLE_APP="myhospital-appareil";
var MIN=60000, HEURE=3600000, JOUR=86400000, TRANCHE=20*MIN, PAIE_DIRECTEUR=100;

// Parties commencées avant le diagnostic : on donne une maladie aux patients déjà là
function migrer(){
  if(!S.diag) S.diag={ok:0,faux:0,auto:0,autoFaux:0};
  if(!S.materiel) S.materiel={};
  S.equipe.forEach(function(e){ if(e.xp===undefined) e.xp=Math.min(SEUILS_XP[e.exp]+(e.soignes||0),e.exp<2?SEUILS_XP[e.exp+1]-1:SEUILS_XP[2]); });
  S.patients=S.patients.filter(function(p){
    var e, l;
    if(p.mal&&MALADIES[p.mal]) return true;
    l=Object.keys(MALADIES).filter(function(k){ return MALADIES[k].sv===p.sv; });
    if(!l.length){ e=parId(S.equipe,p.soignant); if(e&&e.occupe===p.id) e.occupe=null; return false; }
    p.mal=tirer(l); p.symptomes=[]; p.tests={}; p.diag="ok"; return true;
  });
  S.arrivees.forEach(function(a){ delete a.sv; });
  // Parties commencées avant la pharmacie : un petit stock de départ, et les patients déjà orientés gardent leur traitement
  if(!S.stock){
    S.stock={}; S.commandes=[]; S.pharma={marge:MARGE_HABITUELLE,auto:true};
    if(S.fondeLe){ produitsConnus().forEach(function(k){ S.stock[k]=STOCK_DEPART; }); noter(maintenant(),"","La pharmacie ouvre avec un petit stock de départ. Chaque maladie a maintenant son traitement.");
    }
  }
  if(!S.stat.ruptures) S.stat.ruptures={};
  // Parties commencées avant le planning : chacun reçoit une semaine type, et les arrivées du jour sont recalculées
  if(S.equipe.some(function(e){ return !e.plan; })){
    S.equipe.forEach(function(e){ if(!e.plan) e.plan=planAuto(e); });
    if(S.fondeLe){ noter(S.horloge,"","Le planning arrive : chaque personne travaille maintenant par postes de 8 heures. Vérifiez la tuile Planning."); replanifier(S.horloge); }
  }
  if(!S.releve) S.releve=prochaineReleve(S.horloge||Date.now());
  // Parties commencées avant les placements : la fiche du directeur reçoit ses nouvelles rubriques
  if(!S.moi.formations){ var neuf=moiVide(), cle; for(cle in neuf) if(S.moi[cle]===undefined) S.moi[cle]=neuf[cle]; S.moi.gagne=S.moi.argent; }
  S.patients.forEach(function(p){ if(p.etat!=="diag"&&p.trait===undefined){ p.trait=MALADIES[p.mal].tr; p.traitOk=p.diag!=="faux"; p.servi=2; } });
}

function dureeTxt(ms){
  var s=Math.max(0,Math.round(ms/1000)), j=Math.floor(s/86400), hh=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(j) return j+" j "+hh+" h";

  return s+" s";
}

function posteDe(t){ var d=new Date(t), hh=d.getHours(), j=(d.getDay()+6)%7; return hh<6?{j:(j+6)%7,k:"N"}:{j:j,k:hh<14?"M":hh<22?"A":"N"}; }
function prochaineReleve(t){
  var d=new Date(t), heures=[6,14,22,30], i, x;
  for(i=0;i<4;i++){ x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),heures[i],0,0,0).getTime(); if(x>t) return x; }
  return t+8*HEURE;

function inscrire(t,poste,montant){
  montant=Math.round(montant); if(!montant) return;
  var j=cleJour(t), m=cleMois(t);
  if(!S.cj[j]) S.cj[j]={}; if(!S.cm[m]) S.cm[m]={};
  S.cj[j][poste]=(S.cj[j][poste]||0)+montant; S.cm[m][poste]=(S.cm[m][poste]||0)+montant;
  S.caisse+=poste.charAt(0)==="r"||poste.charAt(0)==="p"?montant:-montant;
}
function additionner(src,cles){ var tot={}, i, k, o; for(i=0;i<cles.length;i++){ o=src[cles[i]]; if(o) for(k in o) tot[k]=(tot[k]||0)+o[k]; } return tot; }
function recettesDe(tot){ var k, n=0; for(k in tot) if(k.charAt(0)==="r") n+=tot[k]; return n; }
function depensesDe(tot){ var k, n=0; for(k in tot) if("sfeix".indexOf(k.charAt(0))>=0) n+=tot[k]; return n; }
function typeDe(tot,type){ var k, n=0; for(k in tot) if(k.charAt(0)===type) n+=tot[k]; return n; }
function serviceDe(tot,sv){ var k, r=0, d=0; for(k in tot) if(k.slice(2)===sv){ if(k.charAt(0)==="r") r+=tot[k]; else if("sfeix".indexOf(k.charAt(0))>=0) d+=tot[k]; } return {r:r,d:d}; }
function resultatJour(){ var c=S.cj[cleJour(maintenant())]||{}; return recettesDe(c)-depensesDe(c); }
function noter(t,classe,texte){ S.journal.unshift({t:t,c:classe,m:texte}); if(S.journal.length>JOURNAL_MAX) S.journal.length=JOURNAL_MAX; }

function reputation(){ var n=0, i; for(i=0;i<S.avis.length;i++) n+=S.avis[i]; return S.avis.length?n/S.avis.length:50; }
function avis(note){ S.avis.push(borne(Math.round(note),0,100)); if(S.avis.length>AVIS_MAX) S.avis.shift(); }

}

function radiologueLibre(){ for(var i=0;i<S.equipe.length;i++) if(S.equipe[i].role==="radiologue"&&enPoste(S.equipe[i])) return S.equipe[i]; return null; }

function prixLot(k,n,auto){ return Math.round(PRODUITS[k].cout*n*(n>=GROS_LOT?REMISE_GROS:1)*(auto?SURCOUT_AUTO:1)*(forme("negociateur")?0.9:1)); }

function commander(k,n,t,auto){

  inscrire(t,"f:pharma",prix); S.commandes.push({t:t+DELAI_LIVRAISON,p:k,n:n}); S.commandes.sort(function(a,b){ return a.t-b.t; });
  return true;

// Réapprovisionnement automatique : un lot dès qu'un stock est bas, plus cher qu'une commande faite à la main
function reappro(t){
  if(!S.pharma.auto||!S.portes) return;
  produitsConnus().forEach(function(k){ if(stockDe(k)<=SEUIL_STOCK&&!enCommande(k)) commander(k,LOT,t,true); });
}
// Les traitements proposés pour une maladie : le bon, et trois autres. Le tirage dépend du dossier, pour rester le même d'un affichage à l'autre.
function optionsTraitement(p,k){
  var bon=MALADIES[k].tr, pool=produitsConnus().concat(["repos"]).filter(function(x){ return x!==bon; }), g=p.id*7919+1, i, j, tmp, l;
  function suivant(){ g=(g*48271)%2147483647; return g/2147483647; }
  for(i=0;i<k.length;i++) g=(g*31+k.charCodeAt(i))%2147483647;
  for(i=pool.length-1;i>0;i--){ j=Math.floor(suivant()*(i+1)); tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
  l=pool.slice(0,3); l.splice(Math.floor(suivant()*(l.length+1)),0,bon);
  return l;
}

// Le moral d'un métier dépend du salaire horaire comparé à l'habitude, et de la longueur des journées
function enPoste(e,t){ var q=posteDe(t===undefined?S.horloge:t); return !!e.plan&&e.plan[q.j]===q.k; }
function estSoignant(e){ return ROLES[e.role].service!=="admin"; }

function auTravail(role){ var j=posteDe(S.horloge).j, n=0; S.equipe.forEach(function(e){ if(e.role===role&&e.plan[j]!=="R") n++; }); return n; }
function nbPostes(e,k){ var n=0; e.plan.forEach(function(x){ if(k?x===k:x!=="R") n++; }); return n; }
function prevusLe(sv,j,k){ var n=0; S.equipe.forEach(function(e){ if(SERVICES[sv].roles.indexOf(e.role)>=0&&e.plan[j]===k) n++; }); return n; }
function soignantsLe(j,k){ var n=0; S.equipe.forEach(function(e){ if(estSoignant(e)&&e.plan[j]===k) n++; }); return n; }
// Le moral de chacun dépend de son salaire comparé à l'habitude, du nombre de postes par semaine et du nombre de nuits
function moralDe(e){
  var n=nbPostes(e), nuits=nbPostes(e,"N"), ratio=S.postes[e.role].salaire/ROLES[e.role].salaire;
  return Math.round(borne(70+80*(ratio-1)-Math.max(0,n-5)*12+Math.max(0,5-n)*2-Math.max(0,nuits-3)*4+(forme("meneur")?8:0),0,100));
}
function moral(role){
  var l=S.equipe.filter(function(e){ return e.role===role; }), n=0;
  if(!l.length) return Math.round(borne(70+80*(S.postes[role].salaire/ROLES[role].salaire-1)+(forme("meneur")?8:0),0,100));
  l.forEach(function(e){ n+=moralDe(e); });
  return Math.round(n/l.length);
}
// Une semaine type pour une nouvelle recrue : cinq postes, là où son métier est le moins couvert, en commençant par aujourd'hui
function planAuto(e){
  var plan=["R","R","R","R","R","R","R"], sv=SERVICES[ROLES[e.role].service], choix=sv&&sv.vital&&S.ouverts[ROLES[e.role].service]?["M","A","N"]:["M","A"];
  var auj=jourSemaine(S.horloge||Date.now()), pref=null, i, j, mieux;
  for(i=0;i<5;i++){
    mieux=null;
    for(j=0;j<7;j++){
      if(plan[j]!=="R") continue;
      choix.forEach(function(k){
        var cov=0, sc;
        S.equipe.forEach(function(x){ if(x!==e&&x.role===e.role&&x.plan&&x.plan[j]===k) cov++; });
        sc=cov*10+(pref&&k!==pref?1:0)+(k==="N"?0.5:k==="A"?0.2:0)+((j-auj+7)%7)*0.01;
        if(!mieux||sc<mieux.sc) mieux={sc:sc,j:j,k:k};
      });
    }
    plan[mieux.j]=mieux.k; pref=pref||mieux.k;
  }
  return plan;
}
function qualite(e){
  var q=(EXP[e.exp].qualite+0.04*e.na)*(0.85+0.3*moralDe(e)/100);
  if(e.role!=="chef"&&nb("chef")) q+=0.05;
  return q;
}
function gagnerXp(e,n,t){
  if(e.exp>=2) return;
  e.xp=(e.xp||0)+n;
  while(e.exp<2&&e.xp>=SEUILS_XP[e.exp+1]){
    e.exp++;
    noter(t,"ok",nomComplet(e)+" ("+nomRole(e).toLowerCase()+") a pris de l'expérience : "+(e.femme?"elle":"il")+" passe "+nomExp(e).toLowerCase()+". Son travail s'améliore et son salaire suit.");
  }
}
function prixStage(e){ return Math.round(ROLES[e.role].salaire*3/10)*10; }

function paieDe(e){ return Math.round(S.postes[e.role].salaire*EXP[e.exp].paie); }
function paiePoste(e,k){ return k==="R"?0:Math.round(paieDe(e)*(k==="N"?PRIME_NUIT:1)); }
function masseJour(t){ var j=jourSemaine(t), n=0; S.equipe.forEach(function(e){ n+=paiePoste(e,e.plan[j]); }); return n; }

function chargesJour(){ var n=chargesBatiment()+S.lits*ENTRETIEN_LIT+entretienMateriel(), k; for(k in SERVICES) if(S.ouverts[k]) n+=SERVICES[k].entretien; return n; }
function renoncement(sv,prix){

/* ------------------------------------------------------------------ Personnes */
function identite(femme){ return {femme:femme,prenom:tirer(femme?PRENOMS_F:PRENOMS_M),nom:tirer(NOMS)}; }

function creerPatient(t,force){
  var k=force&&MALADIES[force]&&SERVICES[MALADIES[force].sv].palier<=S.palier?force:null, cles, total=0, r, i, m, sv, p, sej;
  function poids(x){ return SERVICES[MALADIES[x].sv].poids/NB_MALADIES[MALADIES[x].sv]; }
  if(!k){
    // Un patient qu'on fait entrer vient d'abord pour un service ouvert qui a quelqu'un en poste
    cles=Object.keys(MALADIES).filter(function(x){ var v=MALADIES[x].sv; return SERVICES[v].palier<=S.palier&&S.ouverts[v]&&S.equipe.some(function(e){ return SERVICES[v].roles.indexOf(e.role)>=0&&enPoste(e,t); }); });
    if(!cles.length) cles=Object.keys(MALADIES).filter(function(x){ return SERVICES[MALADIES[x].sv].palier<=S.palier; });
    cles.forEach(function(x){ total+=poids(x); });
    r=Math.random()*total;
    for(i=0;i<cles.length;i++){ r-=poids(cles[i]); if(r<=0){ k=cles[i]; break; } }
    k=k||cles[0];
  }
  m=MALADIES[k]; sv=SERVICES[m.sv];
  p=identite(sv.femme?true:Math.random()<0.5);
  p.age=sv.enfant?entre(1,14):sv.femme?entre(20,41):entre(18,88);

  p.symptomes=m.s.slice().sort(function(){ return Math.random()-0.5; }).slice(0,Math.random()<0.5?2:3);
  return p;
}
/* ------------------------------------------------------------------ Le parcours d'un patient */
function ranger(p,t,issue){
  var i=S.patients.indexOf(p); if(i>=0) S.patients.splice(i,1);
  S.registre.unshift({t:t,nom:nomComplet(p),motif:MALADIES[p.mal]?MALADIES[p.mal].nom:(p.motif||""),sv:p.sv,tri:p.tri,issue:issue,paye:p.paye,diag:p.traitOk===false?"soin":(p.diag==="faux"?"faux":"")});
  if(S.registre.length>REGISTRE_MAX) S.registre.length=REGISTRE_MAX;
}
function accueillir(p,t){
  S.stat.arrives++;
  p.etat="diag"; p.limite=t+Math.round(SERVICES[p.sv].patience*(1+0.15*niv("attente")))*MIN; p.auto=t+DELAI_DIAG; S.patients.push(p);
}
// Un test est possible si l'hôpital a ce qu'il faut. Renvoie la raison du refus, ou une chaîne vide.
function testDispo(k){
  var T=TESTS[k];
  if(T.besoin&&!nb(T.besoin)) return "Il faut un infirmier";
  if(T.besoin&&!S.equipe.some(function(e){ return e.role===T.besoin&&enPoste(e); })) return "Aucun infirmier en poste";
  if(T.service){ if(SERVICES[T.service].palier>S.palier) return "Palier "+PALIERS[SERVICES[T.service].palier].nom; if(!S.ouverts[T.service]) return "Service "+SERVICES[T.service].nom+" fermé"; }
  if(T.imagerie){
    if(SERVICES.imagerie.palier>S.palier) return "Palier "+PALIERS[SERVICES.imagerie.palier].nom;
    if(!S.ouverts.imagerie) return "Service Imagerie fermé";
    if(T.palier&&S.palier<T.palier) return "Palier "+PALIERS[T.palier].nom;
    if(!radiologueLibre()) return nb("radiologue")?"Aucun radiologue en poste":"Il faut un radiologue";
  }
  return "";
}
function resultat(p,k){
  var r=MALADIES[p.mal].t[k];
  if(r===undefined) return {txt:TESTS[k].normal,anormal:false};
  return r.charAt(0)==="!"?{txt:r.slice(1),anormal:true}:{txt:r,anormal:false};
}
function faireTest(p,k,t){
  var T=TESTS[k], e;
  if(p.tests[k]||testDispo(k)) return false;
  p.tests[k]=1;
  inscrire(t,T.imagerie?"f:imagerie":T.service?"f:"+T.service:"f:soins",coutTest(k));
  if(T.imagerie){
    e=radiologueLibre(); e.soignes=(e.soignes||0)+1; gagnerXp(e,1,t);
    inscrire(t,"r:imagerie",S.tarifs.imagerie*T.imagerie); p.paye+=S.tarifs.imagerie*T.imagerie; p.imagerie=(p.imagerie||0)+1;
  }
  if(k!=="examen"&&MALADIES[p.mal].t[k]===undefined) p.inutiles=(p.inutiles||0)+1;
  return true;
}
// Une fois le diagnostic posé, le patient part vers le service qui soigne sa maladie
function orienter(p,t,ok,auto,trait,traitOk){
  p.diag=ok?"ok":"faux"; p.parMoi=!auto; p.auto=0; p.trait=trait; p.traitOk=!!traitOk;
  if(auto){ S.diag.auto++; if(!ok) S.diag.autoFaux++; } else if(ok) S.diag.ok++; else S.diag.faux++;
  if(!S.ouverts[p.sv]){ S.stat.transferes++; S.stat.manque[p.sv]=(S.stat.manque[p.sv]||0)+1; avis(ok?45:25); ranger(p,t,"transfert"); return "transfert"; }
  if(Math.random()<renoncement(p.sv,S.tarifs[p.sv])){ S.stat.renonces++; avis(30); ranger(p,t,"renonce"); return "renonce"; }
  p.etat="attente"; affecter(t); return "soin";
}
// Sans réponse du directeur, un médecin fait tous les tests utiles disponibles et tranche. Il se trompe parfois.
function diagnostiquerSeul(p,t){
  var utiles=Object.keys(MALADIES[p.mal].t).filter(function(k){ return k!=="examen"; }), faits=0, q=meilleurMedecin(), bon=MALADIES[p.mal].tr, ok;
  faireTest(p,"examen",t);
  utiles.forEach(function(k){ if(p.tests[k]||faireTest(p,k,t)) faits++; });
  ok=Math.random()<borne(0.6+0.3*(utiles.length?faits/utiles.length:1)+(q-1)*0.4+0.06*niv("labo"),0.45,0.97);
  orienter(p,t,ok,true,ok?bon:optionsTraitement(p,p.mal).filter(function(x){ return x!==bon; })[0],ok);
}
// Les maladies que les symptômes du patient peuvent évoquer
function differentiel(p){
  var enfant=!!SERVICES[p.sv].enfant, ctx=MALADIES[p.mal].c||"", l=[];
  Object.keys(MALADIES).forEach(function(k){
    var m=MALADIES[k], sv=SERVICES[m.sv], n=0;
    if(sv.palier>S.palier||!!sv.enfant!==enfant||(m.c&&m.c!==ctx)) return;
    m.s.forEach(function(x){ if(p.symptomes.indexOf(x)>=0) n++; });
    if(n||k===p.mal) l.push({k:k,n:n});
  });
  l.sort(function(a,b){ return b.n-a.n||(a.k===p.mal?-1:b.k===p.mal?1:0); });
  l=l.slice(0,forme("oeil")?4:8);
  l.sort(function(a,b){ return MALADIES[a.k].nom.localeCompare(MALADIES[b.k].nom,"fr"); });
  return l;
}
// Les patients les plus urgents passent d'abord ; chacun est confié au meilleur soignant libre de son service
function affecter(t){
  var file=enAttente().sort(function(a,b){ return TRI[a.tri][2]-TRI[b.tri][2]||a.arrive-b.arrive; }), pris=false;
  file.forEach(function(p){
    var sv=SERVICES[p.sv], dispo=S.equipe.filter(function(e){ return sv.roles.indexOf(e.role)>=0&&libre(e); }), e, d;
    if(!dispo.length) return;
    dispo.sort(function(a,b){ return qualite(b)-qualite(a); });
    e=dispo[0]; d=Math.max(5,Math.round(sv.duree*EXP[e.exp].vitesse*(MALADIES[p.mal].d||1)*(p.traitOk===false?1.5:1)*(p.sv==="chirurgie"?1-0.15*niv("bloc"):1)));
    p.etat="soin"; p.debut=t; p.fin=t+d*MIN; p.soignant=e.id; p.attente=Math.round((t-p.arrive)/MIN);
    e.occupe=p.id; e.minutes+=d;
    // Le traitement sort du stock au début des soins. En rupture, le patient est soigné sans, et il s'en souvient.
    if(p.trait&&p.trait!=="repos"&&!p.servi){
      if(stockDe(p.trait)>0){ S.stock[p.trait]--; p.servi=1; pris=true; }
      else { p.rupture=1; S.stat.ruptures[p.trait]=(S.stat.ruptures[p.trait]||0)+1; }
    }
  });
  if(pris||file.length) reappro(t);
}
function satisfaction(p,q){
  var sv=SERVICES[p.sv], ratio=S.tarifs[p.sv]/sv.prix, ri=S.tarifs.imagerie/SERVICES.imagerie.prix, n=68+(q-1)*70;
  n-=Math.min(30,p.attente/sv.patience*30);
  n-=ratio>1?(ratio-1)*40:-(1-ratio)*15;
  n-=(1-couvAccueil())*15+(1-couvProprete())*20;
  if(p.traitOk===false) n-=35; else if(p.diag==="faux") n-=10; else if(p.parMoi) n+=5;
  if(p.rupture) n-=15;
  if(p.servi===1&&S.pharma.marge>MARGE_HABITUELLE) n-=(S.pharma.marge-MARGE_HABITUELLE)*0.15;
  n-=(p.inutiles||0)*5;
  n+=bonusPlaque();
  if(p.imagerie&&ri>1) n-=(ri-1)*20*p.imagerie;
  return borne(n,0,100);
}
function finSoin(p,t){
  var sv=SERVICES[p.sv], part=MALADIES[p.mal].p||1, e=parId(S.equipe,p.soignant), prix=Math.round(S.tarifs[p.sv]*part), note;
  if(e){ e.occupe=null; e.soignes=(e.soignes||0)+1; gagnerXp(e,1,t); }
  inscrire(t,"r:"+p.sv,prix); inscrire(t,"f:"+p.sv,Math.max(1,sv.prix*part*PART_FOURNITURES));
  p.paye+=prix; S.soignes++; S.stat.soignes++;
  if(p.servi===1){ inscrire(t,"r:pharma",prixVente(p.trait)); p.paye+=prixVente(p.trait); }
  note=satisfaction(p,e?qualite(e):1);
  if(p.sejour){
    if(litsLibres()>0){ p.etat="lit"; p.entree=t; p.sortie=t+p.sejour*JOUR; p.note=note; affecter(t); monterPalier(t); return; }
    note=Math.max(0,note-15); S.stat.sansLit=(S.stat.sansLit||0)+1;
  }
  avis(note); ranger(p,t,"soigne");
  affecter(t); monterPalier(t);
}
function sortir(p,t){
  var ratio=S.tarifs.lit/REF_LIT;
  avis(p.note-(1-couvLits())*20-(ratio>1?(ratio-1)*30:0));
  ranger(p,t,"sorti");
}
function partir(p,t){
  S.stat.partis++;
  if(p.etat==="diag") S.stat.sansDiag++; else S.stat.sansSoin[p.sv]=(S.stat.sansSoin[p.sv]||0)+1;
  avis(10); ranger(p,t,"parti");
}
/* ------------------------------------------------------------------ Le calendrier */
// Les arrivées d'une journée : chaque service reçoit pendant les postes où il a du personnel prévu.
// Les services d'urgence reçoivent autant la nuit que le jour ; les autres, surtout en journée.
function partDe(sv,k){ return SERVICES[sv].vital?(k==="N"?0.30:0.35):(k==="N"?0.10:0.45); }
function planifierJour(debut,apres,nuitSeule){
  var j=jourSemaine(debut+12*HEURE), svs=debloques().filter(function(k){ return !SERVICES[k].diag; }), total=0, base=attendus(), compte=0;
  svs.forEach(function(k){ total+=SERVICES[k].poids; });
  FENETRES.forEach(function(F){
    if(nuitSeule&&F[0]!=="N") return;
    svs.forEach(function(sv){
      var l=Object.keys(MALADIES).filter(function(x){ return MALADIES[x].sv===sv; }), n, i, t;
      // Un service pas encore ouvert envoie quand même ses patients en journée : ils seront dirigés ailleurs
      if(S.ouverts[sv]?!prevusLe(sv,j,F[0]):(F[0]==="N"||!soignantsLe(j,F[0]))) return;
      n=base*SERVICES[sv].poids/total*partDe(sv,F[0])*alea(0.8,1.2)*(SERVICES[sv].vital?1+0.1*niv("ambulance"):1); n=Math.floor(n)+(Math.random()<n%1?1:0);
      for(i=0;i<n;i++){ t=debut+Math.round(alea(F[1],F[2])*HEURE); if(t>apres){ S.arrivees.push({t:t,mal:tirer(l)}); compte++; } }
    });
  });
  S.arrivees.sort(function(a,b){ return a.t-b.t; });
  if(!nuitSeule) S.prevus=compte;
}
// Quand le planning ou les services changent, les arrivées encore à venir sont recalculées
function replanifier(t){
  if(!S.portes) return;
  S.arrivees=S.arrivees.filter(function(a){ return a.ev; });
  if(new Date(t).getHours()<6) planifierJour(minuit(t-12*HEURE),t,true);
  planifierJour(minuit(t),t);
}
function planifierEvenement(debut){
  if(Math.random()<TAUX_EVENEMENT){ S.evts.push({t:debut+Math.round(alea(8,20)*HEURE)}); S.evts.sort(function(a,b){ return a.t-b.t; }); }
}
function monterPalier(t){
  var p=prochainPalier();
  while(p&&S.soignes>=p.min&&reputation()>=p.rep){
    S.palier++;
    inscrire(t,"r:divers",p.subvention);
    noter(t,"ok",S.nom+" devient « "+p.nom+" ». La région verse une subvention de "+mt(p.subvention)+" et de nouveaux services sont débloqués.");
    p=prochainPalier();
    reappro(t); replanifier(t);
  }
}
// De temps en temps, un événement vient bousculer la journée
function declencher(t){
  var choix=["epidemie","inspection"], k, i, m;
  if(!enPosteMaintenant()) return;
  if(S.palier>=1) choix.push("accident");
  if(reputation()>=60) choix.push("don");
  if(S.ouverts.imagerie) choix.push("panne");
  k=tirer(choix);
  if(k==="epidemie"){
    for(i=0;i<5;i++) S.arrivees.push({t:t+Math.round(alea(2,120)*MIN),mal:"grippe",ev:1});
    noter(t,"warn","Épidémie de grippe en ville : cinq patients de plus sont attendus en consultation dans les deux heures.");
  } else if(k==="accident"){
    for(i=0;i<4;i++) S.arrivees.push({t:t+Math.round(alea(1,15)*MIN),mal:tirer(["fracture","commotion"]),ev:1});
    noter(t,"warn","Carambolage à la sortie de la ville : quatre blessés arrivent à l'hôpital.");
  } else if(k==="inspection"){
    if(couvProprete()>=0.8){ avis(90); avis(90); avis(90); noter(t,"ok","Inspection sanitaire : les locaux sont irréprochables. La réputation de l'hôpital en profite."); }
    else { m=150*(S.palier+1); inscrire(t,"x:divers",m); noter(t,"bad","Inspection sanitaire : les locaux ne sont pas assez propres. Amende de "+mt(m)+"."); }
  } else if(k==="don"){
    m=Math.round(15*(S.palier+1)*reputation()/60)*10; inscrire(t,"r:divers",m);
    noter(t,"ok","Un ancien patient reconnaissant fait un don de "+mt(m)+" à l'hôpital.");
  } else {
    inscrire(t,"e:imagerie",250); noter(t,"warn","Panne de l'appareil de radiologie : la réparation coûte "+mt(250)+".");
  }
  S.arrivees.sort(function(a,b){ return a.t-b.t; });
}
// À minuit : paie, charges, journées d'hospitalisation, démissions, puis préparation de la journée suivante
// Chaque nuit : le portefeuille d'actions rapporte entre 2 % et 7 % par an (le taux bouge un peu chaque jour),
// et l'hôpital verse au directeur les intérêts de ce qu'il lui a prêté.
function financesPerso(t){
  var M=S.moi, gain, entier;
  M.taux=borne(M.taux+(4.5-M.taux)*0.08+alea(-0.6,0.6),TAUX_MIN,TAUX_MAX);
  if(M.place>0){ gain=M.place*M.taux/100/365; M.place+=gain; M.gainsPlace+=gain; }
  if(M.pret>0){
    M.interets+=M.pret*TAUX_PRET/100/365; entier=Math.floor(M.interets);
    if(entier>=1){ inscrire(t,"x:pret",entier); M.argent+=entier; M.gainsPret+=entier; M.interets-=entier; }
  }
}
function cloturer(t){
  var tj=t-1000, k, c, res, garde, vieux;
  S.equipe.forEach(function(e){
    var k=e.plan[jourSemaine(tj)];
    inscrire(tj,"s:"+ROLES[e.role].service,paiePoste(e,k));
    if(k!=="R") gagnerXp(e,estSoignant(e)?XP_POSTE_SOIGNANT:XP_POSTE_AUTRE,tj);
  });
  inscrire(tj,"e:batiment",chargesBatiment());
  for(k in SERVICES) if(S.ouverts[k]) inscrire(tj,"e:"+k,SERVICES[k].entretien);
  inscrire(tj,"e:lits",S.lits*ENTRETIEN_LIT);
  inscrire(tj,"e:materiel",entretienMateriel());
  S.patients.forEach(function(p){ if(p.etat==="lit"){ inscrire(tj,"r:lits",S.tarifs.lit); p.paye+=S.tarifs.lit; } });
  if(S.caisse<0) inscrire(tj,"x:divers",Math.max(1,-S.caisse*TAUX_DECOUVERT));
  financesPerso(tj);
  S.equipe.slice().forEach(function(e){
    var m=moralDe(e);
    if(m<30&&!e.occupe&&Math.random()<(30-m)/100){
      S.equipe.splice(S.equipe.indexOf(e),1);
      noter(tj,"bad",nomComplet(e)+" ("+nomRole(e).toLowerCase()+") démissionne : le salaire et le planning ne lui conviennent plus.");
    }
  });
  c=S.cj[cleJour(tj)]||{}; res=recettesDe(c)-depensesDe(c);
  if(S.portes) noter(tj,res>=0?"ok":"warn","Jour "+S.jour+" : "+pl(S.stat.soignes,"patient soigné","patients soignés")+(S.stat.partis?", "+pl(S.stat.partis,"reparti","repartis")+" sans soins":"")+(S.stat.transferes?", "+pl(S.stat.transferes,"envoyé","envoyés")+" ailleurs":"")+". Résultat de la journée : "+signeM(res)+".");
  S.stat=statVide(); S.jour++;
  S.equipe.forEach(function(e){ e.minutes=0; });
  garde=cleJour(t-JOURS_GARDES*JOUR);
  for(vieux in S.cj) if(vieux<garde) delete S.cj[vieux];
  monterPalier(t);
  if(S.portes){ planifierJour(t,t); planifierEvenement(t); }
  affecter(t); reappro(t);
}
// Le temps réel : on rejoue dans l'ordre tout ce qui devait arriver jusqu'à l'instant donné
function avancer(jusqua){
  var change=false, garde=0, t, quoi, qui, i, p, e, q, a, med;
  if(!S.fondeLe) return false;
  while(garde++<400000){
    t=S.prochaineCloture; quoi="cloture"; qui=null; med=meilleurMedecin()>0;
    if(S.arrivees.length&&S.arrivees[0].t<t){ t=S.arrivees[0].t; quoi="arrivee"; }
    if(S.evts.length&&S.evts[0].t<t){ t=S.evts[0].t; quoi="evenement"; }
    if(S.commandes.length&&S.commandes[0].t<t){ t=S.commandes[0].t; quoi="livraison"; }
    if(S.releve&&S.releve<t){ t=S.releve; quoi="releve"; }
    for(i=0;i<S.patients.length;i++){
      p=S.patients[i];
      if(p.etat==="diag"){ if(med&&p.auto&&p.auto<=p.limite){ e=p.auto; q="relais"; } else { e=p.limite; q="depart"; } }
      else if(p.etat==="attente"){ e=p.limite; q="depart"; }
      else if(p.etat==="soin"){ e=p.fin; q="soin"; }
      else { e=p.sortie; q="lit"; }
      if(e<t){ t=e; quoi=q; qui=p; }
    }
    if(t>jusqua) break;
    if(t<S.horloge) t=S.horloge;
    change=true; S.horloge=t;
    if(quoi==="cloture"){ cloturer(t); S.prochaineCloture=prochainMinuit(t+1000); }
    else if(quoi==="arrivee"){ a=S.arrivees.shift(); accueillir(creerPatient(t,a.mal||null),t); }
    else if(quoi==="evenement"){ S.evts.shift(); declencher(t); }
    else if(quoi==="livraison"){ a=S.commandes.shift(); S.stock[a.p]=stockDe(a.p)+a.n; }
    else if(quoi==="releve"){ S.releve=prochaineReleve(t+1000); affecter(t); }
    else if(quoi==="relais") diagnostiquerSeul(qui,t);
    else if(quoi==="depart") partir(qui,t);
    else if(quoi==="soin") finSoin(qui,t);
    else { sortir(qui,t); affecter(t); }
  }
  if(jusqua>S.horloge) S.horloge=jusqua;
  return change;
}
// Le salaire du directeur : PAIE_DIRECTEUR par tranche de vingt minutes passées sur le jeu
function activite(ms){
  var paye=false;
  S.moi.actif+=ms; S.moi.tranche+=ms;
  while(S.moi.tranche>=TRANCHE){
    S.moi.tranche-=TRANCHE; S.moi.argent+=PAIE_DIRECTEUR; S.moi.gagne+=PAIE_DIRECTEUR; inscrire(maintenant(),"s:direction",PAIE_DIRECTEUR); paye=true;
  }
  return paye;
}

    m=MALADIES[p.mal]; ok=U.choix===p.mal; bon=U.trait===m.tr;
    if(ok&&bon) txt="Bon diagnostic et bon traitement : "+m.nom+", "+nomProduit(m.tr).toLowerCase()+".";
    else if(ok) txt="Bon diagnostic ("+m.nom+"), mais mauvais traitement : il fallait « "+nomProduit(m.tr)+" », pas « "+nomProduit(U.trait)+" ».";
    else if(bon) txt="Erreur de diagnostic : c'était « "+m.nom+" », pas « "+MALADIES[U.choix].nom+" ». Le traitement choisi convient quand même.";
    else txt="Erreur de diagnostic : c'était « "+m.nom+" », pas « "+MALADIES[U.choix].nom+" ». Il fallait « "+nomProduit(m.tr)+" ».";
    r=orienter(p,t,ok,false,U.trait,bon);
    if(r==="transfert") txt+=" Le service "+SERVICES[p.sv].nom+" n'est pas ouvert : le patient est envoyé ailleurs.";
    else if(r==="renonce") txt+=" Le patient trouve le tarif trop élevé et s'en va.";
    else txt+=bon?" Le patient passe au service "+SERVICES[p.sv].nom+".":" Les soins seront plus longs et le patient repartira mécontent.";
    U.retour={c:ok&&bon?"ok":bon?"warn":"bad",m:txt}; U.ecran="patients"; U.dossier=null; U.choix=null; U.trait=null; return true;
  },
  role:function(d){ U.role=d.k; candidatsDe(d.k); return true; },
  recruter:function(d){ U.role=d.k; U.ecran="recrutement"; candidatsDe(d.k); return true; },
  autres:function(){ var r=roleCourant(); S.candidats[r]=[]; candidatsDe(r); return true; },
  engager:function(d){
    var r=roleCourant(), c=parId(S.candidats[r]||[],+d.k), t=maintenant();
    if(!c||(ROLES[r].unique&&nb(r))) return false;
    S.candidats[r].splice(S.candidats[r].indexOf(c),1);
    c={id:S.nEquipe++,prenom:c.prenom,nom:c.nom,femme:c.femme,age:c.age,role:r,exp:c.exp,atouts:c.atouts,na:c.na,depuis:t,occupe:null,minutes:0,soignes:0};
    c.xp=SEUILS_XP[c.exp]; c.plan=planAuto(c); S.equipe.push(c);
    noter(t,"",nomComplet(c)+" rejoint l'équipe comme "+(c.femme?ROLES[r].f:ROLES[r].nom).toLowerCase()+".");
    if(!S.portes&&ROLES[r].service!=="admin"){ S.portes=true; noter(t,"ok","Le cabinet ouvre ses portes : les premiers patients peuvent venir."); }
    replanifier(t);
    if(MEDECINS.indexOf(r)>=0) S.patients.forEach(function(p){ if(p.etat==="diag"&&p.auto<t+5*MIN) p.auto=t+5*MIN; });
    if(!S.candidats[r].length||ROLES[r].unique){ S.candidats[r]=[]; }
    if(ROLES[r].unique) U.ecran="equipe"; else candidatsDe(r);
    affecter(t); return true;
  },
  licencier:function(d){
    var e=parId(S.equipe,+d.k);
    if(!e||e.occupe) return false;
    if(U.confirme!=="e"+e.id){ U.confirme="e"+e.id; return false; }
    U.confirme=null; S.equipe.splice(S.equipe.indexOf(e),1);
    noter(maintenant(),"",nomComplet(e)+" ("+nomRole(e).toLowerCase()+") quitte l'hôpital.");
    replanifier(maintenant()); return true;
  },
  salaire:function(d){ var p=S.postes[d.k], R=ROLES[d.k]; p.salaire=borne(p.salaire+(+d.d),Math.round(R.salaire*0.5),Math.round(R.salaire*2.5)); return true; },
  planvue:function(d){ U.planVue=d.k; return false; },
  stage:function(d){
    var e=parId(S.equipe,+d.k), t=maintenant(), prix;
    if(!e||!stagePossible(e)) return false;
    prix=prixStage(e); if(S.caisse<prix) return false;
    inscrire(t,"e:"+ROLES[e.role].service,prix); e.stage=t; gagnerXp(e,XP_STAGE,t);
    return true;
  },
  plan:function(d){
    var e=parId(S.equipe,+d.k), j=+d.d, t=maintenant();
    if(!e||!(j>=0&&j<7)) return false;
    e.plan[j]=CYCLE_POSTES[e.plan[j]]||"M"; replanifier(t); affecter(t); return true;
  },
  prix:function(d){ var ref=d.k==="lit"?REF_LIT:SERVICES[d.k].prix; S.tarifs[d.k]=borne(S.tarifs[d.k]+(+d.d),0,ref*5); return true; },
  ouvrir:function(d){
    var sv=SERVICES[d.k], t=maintenant();
    if(!sv||S.ouverts[d.k]||sv.palier>S.palier||S.caisse<sv.cout) return false;
    S.ouverts[d.k]=true; inscrire(t,"i:"+d.k,sv.cout);
    noter(t,"ok","Le service "+sv.nom+" ouvre ("+mt(sv.cout)+" d'équipement). Il lui faut maintenant du personnel.");
    replanifier(t); return true;
  },
  lit:function(){
    if(S.palier<1||S.caisse<PRIX_LIT) return false;
    S.lits++; inscrire(maintenant(),"i:lits",PRIX_LIT); return true;
  },
  equiper:function(d){
    var m=MATERIEL.filter(function(x){ return x[0]===d.k; })[0], t=maintenant(), n, prix;
    if(!m||m[3]>S.palier) return false;
    n=niv(m[0]); prix=m[2]*COUT_NIVEAU[n];
    if(n>=NIVEAU_MAX||S.caisse<prix) return false;
    S.materiel[m[0]]=n+1; inscrire(t,"i:materiel",prix);
    noter(t,"ok",m[1]+" : niveau "+(n+1)+" ("+mt(prix)+").");
    if(m[0]==="ambulance") replanifier(t);
    return true;
  },
  vue:function(d){ U.vue=d.k; U.decal=0; return false; },
  decal:function(d){ U.decal=Math.min(0,U.decal+(+d.d)); return false; },
  resume:function(){ U.resume=null; return false; },
  moivue:function(d){ U.moiVue=d.k; return false; },
  former:function(d){
    var f=FORMATIONS.filter(function(x){ return x[0]===d.k; })[0];
    if(!f||forme(f[0])||S.moi.argent<f[2]) return false;
    S.moi.argent-=f[2]; S.moi.formations[f[0]]=1;
    noter(maintenant(),"ok",S.prenom+" suit la formation « "+f[1]+" ».");
    if(f[0]==="communicant") replanifier(maintenant());
    return true;
  },
  placer:function(d){
    var M=S.moi, n=d.d==="tout"?(d.k==="in"?Math.floor(M.argent):M.place):+d.d;
    if(!(n>0)) return false;
    if(d.k==="in"){ if(M.argent<n) return false; M.argent-=n; M.place+=n; }
    else { if(M.place<n) return false; M.place-=n; M.argent+=n; if(M.place<0.005) M.place=0; }
    return true;
  },
  preter:function(d){
    var M=S.moi, t=maintenant(), n=d.d==="tout"?M.pret:+d.d;
    if(!(n>0)) return false;
    if(d.k==="in"){ if(M.argent<n) return false; M.argent-=n; M.pret+=n; inscrire(t,"p:pret",n); noter(t,"",S.prenom+" prête "+mt(n)+" à l'hôpital."); }
    else { if(M.pret<n||S.caisse<n) return false; M.pret-=n; M.argent+=n; inscrire(t,"q:pret",n); noter(t,"","L'hôpital rembourse "+mt(n)+" à "+S.prenom+"."); }
    return true;
  },
  donner:function(d){
    var M=S.moi, t=maintenant(), n=+d.d, avant=bonusPlaque(), i, obtenue;
    if(!(n>0)||M.argent<n) return false;
    M.argent-=n; M.dons+=n; inscrire(t,"r:divers",n);
    for(i=0;i<Math.min(5,Math.round(n/200));i++) avis(92);
    obtenue=bonusPlaque()>avant?PLAQUES.filter(function(x){ return M.dons>=x[0]; }).pop():null;
    noter(t,"ok",S.prenom+" fait un don de "+mt(n)+" à l'hôpital."+(obtenue?" L'hôpital inaugure « "+obtenue[1].toLowerCase()+" ».":""));
    return true;
  },
  acheter:function(d){
    var b=BIENS.filter(function(x){ return x[0]===d.k; })[0];
    if(!b||S.moi.biens[b[0]]||S.moi.argent<b[2]) return false;
    S.moi.argent-=b[2]; S.moi.biens[b[0]]=1; return true;
  },
  recommencer:function(){
    if(U.confirme!=="recommencer"){ U.confirme="recommencer"; return false; }
    U.confirme=null; U.resume=null; U.ecran="accueil"; S=etatInitial();
    try{ localStorage.removeItem(CLE); }catch(e){}
    if(nuage.ref){ nuage.connu=null; nuage.sale=false; nuage.ref.delete().catch(function(){}); }
    return false;
  }
};
function roleCourant(){
  var roles=ORDRE_ROLES.filter(function(r){ return ROLES[r].palier<=S.palier&&!(ROLES[r].unique&&nb(r)); });
  if(roles.indexOf(U.role)<0) U.role=roles[0];
  return U.role;
}

/* ------------------------------------------------------------------ Sauvegarde sur le compte (téléphone et ordinateur) */
var APPAREIL=(function(){ var id=null; try{ id=localStorage.getItem(CLE_APP); if(!id){ id="a"+Math.random().toString(36).slice(2,12); localStorage.setItem(CLE_APP,id); } }catch(e){} return id||"a"+Math.random().toString(36).slice(2,12); })();
var nuage={ref:null,connu:null,occupe:false,sale:false,dernier:0}, gel=false;
function marquer(){ S.modif=Date.now(); nuage.sale=true; }
function pousser(force){
  var t, corps;
  if(!nuage.ref||nuage.occupe||!nuage.sale||!S.fondeLe) return;
  if(!force&&Date.now()-nuage.dernier<15000) return;
  t=S.modif||Date.now(); corps={v:V,t:t,appareil:APPAREIL,json:JSON.stringify(S)};
  if(corps.json.length>200000){ S.registre.length=Math.min(S.registre.length,20); S.journal.length=Math.min(S.journal.length,40); corps.json=JSON.stringify(S); }
  nuage.occupe=true; nuage.sale=false; nuage.dernier=Date.now();
  nuage.ref.set(corps).then(function(){ nuage.connu=t; nuage.occupe=false; },function(e){
    nuage.occupe=false;
    if(e&&(e.code==="unavailable"||e.code==="resource_exhausted")) nuage.sale=true; else nuage.ref=null;
  });
}
function adopter(d){
  var o; try{ o=JSON.parse(d.json); }catch(e){ return false; }
  if(!valide(o)||!o.fondeLe) return false;
  S=o; migrer(); nuage.connu=d.t; nuage.sale=false; avancer(maintenant()); sauver(); return true;
}
function distant(d){ return !!(d&&d.json&&d.appareil!==APPAREIL&&d.t!==nuage.connu&&d.t>(nuage.connu||0)); }
function brancher(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(id){
      var ref;
      if(!id) return null;
      try{ ref=db.doc("data/users/"+id+"/partie"); }catch(e){ return null; }
      return ref.get().then(function(snap){
        var d=snap.exists?snap.data():null;
        nuage.ref=ref;
        if(d&&d.json&&(!S.fondeLe||d.t>(S.modif||0))){ if(adopter(d)) rendre(); }
        else { if(d) nuage.connu=d.t; if(S.fondeLe) nuage.sale=true; }
        ref.onSnapshot(function(s){
          var x=s.exists?s.data():null;
          if(s.metadata&&s.metadata.hasPendingWrites) return;
          if(distant(x)&&adopter(x)) rendre();
        },function(){});
        pousser(true);
        if(U.ecran==="reglages") rendre();
      });
    });
  }).catch(function(){});
}
// Au retour sur le jeu, on regarde d'abord si la partie a avancé sur un autre appareil
function revenir(){
  var fini=false;
  function suite(){ if(fini) return; fini=true; gel=false; battement(true); }
  if(!nuage.ref||!S.fondeLe){ battement(true); return; }
  gel=true; setTimeout(suite,4000);
  nuage.ref.get().then(function(snap){ var d=snap.exists?snap.data():null; if(distant(d)) adopter(d); suite(); },suite);
}

/* ------------------------------------------------------------------ Boucle */
var app=document.getElementById("app"), dernier="", dernierBattement=Date.now();
var ECRANS={accueil:ecranAccueil,patients:ecranPatients,dossier:ecranDossier,maladies:ecranMaladies,pharmacie:ecranPharmacie,planning:ecranPlanning,materiel:ecranMateriel,equipe:ecranEquipe,recrutement:ecranRecrutement,services:ecranServices,tarifs:ecranTarifs,finances:ecranFinances,journal:ecranJournal,moi:ecranMoi,reglages:ecranReglages};
function rendre(){
  var y=window.scrollY, cle=S.fondeLe?U.ecran:"fondation";
  app.innerHTML='<div class="ecran">'+(S.fondeLe?(ECRANS[U.ecran]||ecranAccueil)():ecranFondation())+'</div>'+(S.fondeLe?navigation():"");
  if(cle!==dernier){ window.scrollTo(0,0); dernier=cle; } else window.scrollTo(0,y);
  sauver();
}
function tic(){
  var n=maintenant(), l, i, x;
  x=document.getElementById("horloge"); if(x) x.textContent=horlogeTxt(n);
  x=document.getElementById("paie-reste"); if(x) x.textContent=resteActivite();
  l=document.querySelectorAll("[data-reste]"); for(i=0;i<l.length;i++) l[i].textContent=resteTxt(+l[i].dataset.reste);
  l=document.querySelectorAll("[data-fin]"); for(i=0;i<l.length;i++) l[i].style.width=borne((n-(+l[i].dataset.debut))/((+l[i].dataset.fin)-(+l[i].dataset.debut))*100,0,100)+"%";
}
function resumer(avant){
  var d=maintenant()-avant.t;
  if(d<HEURE) return;
  U.resume={duree:d,soignes:S.soignes-avant.soignes,caisse:Math.round(S.caisse-avant.caisse),rep:Math.round(reputation()-avant.rep)};
}
function battement(retour){
  var n=Date.now(), ecoule=Math.min(n-dernierBattement,2000), paye, avant, change;
  dernierBattement=n;
  if(!S.fondeLe||gel||document.hidden) return;
  avant={t:S.horloge,soignes:S.soignes,caisse:S.caisse,rep:reputation()};
  paye=activite(ecoule);
  change=avancer(maintenant());
  if(retour) resumer(avant);
  if(change||paye){ marquer(); rendre(); } else if(retour) rendre(); else tic();
  pousser(false);
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-a]"):null, change;
  if(!el||el.disabled||!A[el.dataset.a]) return;
  if(el.dataset.a!=="licencier"&&el.dataset.a!=="recommencer") U.confirme=null;
  change=A[el.dataset.a](el.dataset);
  if(change) marquer();
  rendre();
  if(change) pousser(false);
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="f-nom") U.fond.nom=ev.target.value;
  if(ev.target.id==="f-prenom") U.fond.prenom=ev.target.value;
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ sauver(); pousser(true); } else { dernierBattement=Date.now(); revenir(); }
});

function demarrer(donnees){
  var repris=(donnees&&valide(donnees.S))?donnees.S:charger(), avant;
  if(donnees&&donnees.U) U=donnees.U;
  if(!("retour" in U)){ U.dossier=null; U.choix=null; U.retour=null; }
  if(!("trait" in U)) U.trait=null;
  if(!U.moiVue) U.moiVue="fiche";
  if(!U.planVue) U.planVue="medecins";
  if(repris){
    S=repris; migrer();
    avant={t:S.horloge,soignes:S.soignes,caisse:S.caisse,rep:reputation()};
    if(S.fondeLe&&avancer(maintenant())){ marquer(); resumer(avant); }
  }
  rendre();
  setInterval(battement,1000);
  brancher();
}
var chaud=window.claude&&window.claude.hot;
if(chaud&&chaud.snapshot) chaud.snapshot(function(){ return {S:S,U:U}; });
if(chaud&&chaud.ready) chaud.ready(demarrer); else demarrer(chaud&&chaud.data);
window.__hopital={etat:function(){ return S; },ecran:function(e){ U.ecran=e; rendre(); },
  sauter:function(ms){ S.decalage=(S.decalage||0)+ms; var c=avancer(maintenant()); rendre(); return c; },
  calc:{posteDe:posteDe,moralDe:moralDe,optionsTraitement:optionsTraitement,produitsConnus:produitsConnus,differentiel:differentiel,testDispo:testDispo,reputation:reputation,moral:moral,attendus:attendus,periode:periode,renoncement:renoncement}};
})();
</script>
